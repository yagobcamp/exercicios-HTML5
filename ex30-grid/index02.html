<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.conteiner {
            border: 4px solid blue;
            height: 250px;
            display: grid;
            grid-template: repeat(3, auto) / repeat (3, auto); /*grid-template-rows: auto auto auto;
            grid-template-columns: auto auto auto;*/
            gap: 10px; 
            place-items: start center; /*align- items e justify items*/
            place-content: space-between end; /* align-content e justfy-content */
           
        }

        div.item {
            border: 3px solid red;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">a</div>
        <div class="item">b</div>
        <div class="item">c</div>
        <div class="item">d</div>
        <div class="item">e</div>
        <div class="item">f</div>
        <div class="item">g</div>
    </div>
</body>
</html>
