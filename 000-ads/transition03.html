<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
      
            /* Elemento que vamos aplicar a transição */
            div {
                width: 300px;
                height: 150px;
                background-color: #00F;
                border: 2px dotted black;
                border-radius: 20px;
                transition: width 2s, height 4s; /* propriedade transition informando que será alterada a largura e altura  com tempos diferentes*/
                transition-timing-function: ease-out;/*controla a forma como a transição funcionará, neste caso com um fim mais lento*/
                }
            /* elemento div com o estado houve - mouse sobre - que ativará a transição até 600px de largura e 300px de altura*/ 
            div:hover
                {  
                width: 600px;
                height: 300px;
                border-radius: 10px;
                
                }
 
        </style>
</head>
<body>
    <div>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis voluptatum iusto est iure eligendi quis aspernatur voluptas sunt temporibus adipisci eum odio soluta earum, corrupti explicabo deleniti ipsum. Amet, porro.
        </p>
    </div>
</body>
</html>
