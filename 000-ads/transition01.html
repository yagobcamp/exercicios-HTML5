<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
     <style>
      
            /* Elemento que vamos aplicar a transição */
            div {
                width: 300px;
                height: 200px;
                background-color: #00F;
                transition: width 2s, height 4s; /* propriedade transition informando que será alterada a largura e altura  com tempos diferentes*/   
                }
            /* elemento div com o estado active - clicado - que ativará a transição até 600px de largura e 300px de altura*/ 
            div:active
                {  
                width: 600px;
                height: 300px;
                }
 
        </style>
</head>
<body>
    <div>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Maxime, eveniet saepe, distinctio fuga explicabo a culpa non iure fugiat, quasi illo? Consequatur provident inventore voluptas quos dolor consequuntur corporis. Facilis!
        </p>
    </div>
</body>
</html>
