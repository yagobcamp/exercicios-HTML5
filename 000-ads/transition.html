<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
     <style>
      
            /* Elemento que vamos aplicar a transição */
            div {
                width: 300px;
                height: 200px;
                background-color: #00F;
                transition: width 4s; /* propriedade transition informando que será alterada a largura no tempo de 4 segundos*/   
                }
            /* elemento div com o estado hover - mouse sobre - que ativará a transição até 600px de largura*/ 
            div:hover {  
                width: 600px;
                }
        </style>
</head>
<body>
    <div>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Minus sint nisi amet? Labore quae reiciendis voluptate maiores quaerat necessitatibus molestias hic porro, qui consequuntur architecto odio repudiandae consequatur debitis velit!</p>
    </div>
</body>
</html>
