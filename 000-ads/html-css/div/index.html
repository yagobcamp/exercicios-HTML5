<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs</title>
    <style>
        body {
            background-color: #fff;
        }

        #geral {
            width: 100%;
            height: 700px;
            background-color: #fff;
        }

        #topo {
            width: 100%;
            height: 20%;
            background-color: #067406;
            color:#fff;
            border-radius: 10px 10px 0px 0px;
        }

        #lado {
            float: left;
            width: 20%;
            height: 60%;
            background-color: #a8a4a4;
        }

        #meio {
            float: left;
            width: 80%;
            height: 60%;
            background-color: #070774;
            color:#fff;
        }

        #rodape {
            width: 100%;
            height: 20%;
            background-color: #d8d818;
            clear: both;
            border-radius: 0px 0px 10px 10px;
        }

    </style>
</head>
<body>
    <div id="geral">
        <div id="topo">div topo</div>
        <div id="lado">div lado</div>
        <div id="meio">div meio</div>
        <div id="rodape">div rodape</div>
    </div>
</body>
</html>
